# 🚀 DEPLOYMENT WORKFLOW
# This workflow automatically deploys your code to hosting via FTP
# whenever you push changes to the main branch.

on:
  push:
    branches:
      - main              # 👉 Runs only on pushes to main branch
                          # 💡 Change to 'master' if your main branch is called master

jobs:
  deploy:
    name: 🎉 Deploy to Hosting
    runs-on: ubuntu-latest # 👉 Uses latest Ubuntu Linux environment
                           # 💡 This is a fresh virtual machine each time

    steps:
      # STEP 1: DOWNLOAD CODE FROM GITHUB
      - name: 🚚 Get latest code
        uses: actions/checkout@v4  # 👉 Downloads your repository code
                                   # 💡 This makes your files available to subsequent steps

      # STEP 2: UPLOAD TO WEB HOSTING VIA FTP
      - name: 📂 Sync files to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4  # 👉 Popular FTP deployment tool
        with:
          # 🔐 SECURITY: These values come from encrypted secrets (Settings > Secrets)
          server: ${{ secrets.FTP_SERVER }}        # 👉 Your FTP hostname (e.g., yourdomain.com)
          username: ${{ secrets.FTP_USERNAME }}    # 👉 Your FTP login username  
          password: ${{ secrets.FTP_PASSWORD }}    # 👉 Your FTP login password
          
          # 📁 FOLDER MAPPING
          server-dir: "/public_html/"              # 👉 Where files go on your server
                                                   # 💡 Common: /public_html/, /htdocs/, /www/
          local-dir: "./"                          # 👉 Which local files to upload
                                                   # 💡 "./" means "all files in repository root"